name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtsvg'

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build pardus-pen
        run: |
          cmake --build build --config Release

      - name: Bundle Windows Runtime (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/pardus-pen.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = "build/pardus-pen.exe"
          }
          $binDir = Split-Path $exePath
          windeployqt --release --compiler-runtime --no-translations $exePath
          Copy-Item -Recurse -Force "data/backgrounds" "$binDir/backgrounds"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PardusKalem-Windows-x64
          path: |
            build/Release/
            build/pardus-pen.exe
            build/*.dll
            build/backgrounds/
            build/platforms/
            build/styles/
            build/imageformats/
            build/iconengines/
