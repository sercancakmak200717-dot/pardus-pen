name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          setup-python: false

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build pardus-pen
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Post Failure Log to GitHub Issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tailLog = Get-Content build.log -Tail 80 -Raw
          $bodyObj = @{
            title = "Build Error Diagnostic Log"
            body = "Build failed. Tail of build.log:`n```text`n$tailLog`n```"
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Method Post -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Body $bodyObj -ContentType "application/json"

      - name: Bundle Windows Runtime (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/pardus-pen.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = "build/pardus-pen.exe"
          }
          $binDir = Split-Path $exePath
          windeployqt --release --compiler-runtime --no-translations $exePath
          Copy-Item -Recurse -Force "data/backgrounds" "$binDir/backgrounds"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PardusKalem-Windows-x64
          path: |
            build/Release/
            build/pardus-pen.exe
            build/*.dll
            build/backgrounds/
            build/platforms/
            build/styles/
            build/imageformats/
            build/iconengines/
