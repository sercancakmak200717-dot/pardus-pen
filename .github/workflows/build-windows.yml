name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          setup-python: false

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build pardus-pen
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "### Build Error Log (Tail 60 lines):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY
            "```" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 60 | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            "```" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Bundle Windows Runtime (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/pardus-pen.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = "build/pardus-pen.exe"
          }
          $binDir = Split-Path $exePath
          windeployqt --release --compiler-runtime --no-translations $exePath
          Copy-Item -Recurse -Force "data/backgrounds" "$binDir/backgrounds"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PardusKalem-Windows-x64
          path: |
            build/Release/
            build/pardus-pen.exe
            build/*.dll
            build/backgrounds/
            build/platforms/
            build/styles/
            build/imageformats/
            build/iconengines/

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
